name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kit_test
          POSTGRES_PASSWORD: kit_test
          POSTGRES_DB: kit_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U kit_test" --health-interval 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1-management-alpine
        ports: ['5672:5672']
        options: --health-cmd "rabbitmq-diagnostics -q check_port_connectivity" --health-interval 5s --health-retries 30
    env:
      KIT_TEST_DATABASE_URL: postgres://kit_test:kit_test@localhost:5432/kit_test
      KIT_TEST_AMQP_URL: amqp://guest:guest@localhost:5672
      KIT_TEST_DECLARE_EXCHANGES: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - name: Unit and integration tests (real Postgres + RabbitMQ, including a broker restart)
        run: bun test
        env:
          KIT_TEST_RABBIT_CONTAINER: ${{ job.services.rabbitmq.id }}
