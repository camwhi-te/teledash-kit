# Reusable CI for Teledash daemons. Call it from a daemon repo:
#
#   jobs:
#     ci:
#       uses: camwhi-te/teledash-kit/.github/workflows/daemon-ci.yml@main
#
# Tests get a real Postgres and RabbitMQ through TEST_DATABASE_URL, TEST_AMQP_URL
# (exchanges must be declared by the test: TEST_DECLARE_EXCHANGES=true) and can
# restart the broker with `docker restart $TEST_RABBIT_CONTAINER`.
name: daemon-ci

on:
  workflow_call:
    inputs:
      entrypoint:
        description: File compiled into the service binary
        type: string
        default: src/main.ts

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U test" --health-interval 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1-management-alpine
        ports: ['5672:5672']
        options: --health-cmd "rabbitmq-diagnostics -q check_port_connectivity" --health-interval 5s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test
      TEST_AMQP_URL: amqp://guest:guest@localhost:5672
      TEST_DECLARE_EXCHANGES: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bunx biome check .
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test
        run: bun test
        env:
          TEST_RABBIT_CONTAINER: ${{ job.services.rabbitmq.id }}
      - name: Compile binary
        run: bun build ${{ inputs.entrypoint }} --compile --minify --sourcemap --outfile dist/service
      - name: Build image
        run: docker build -t ci-image .
